[project]
name = "capacitacion-axity-python"
version = "0.1.0"
description = ""
authors = [
    {name = "Erick Sebastian Meneses Navarro",email = "erick.meneses@axity.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "tzdata (>=2026.4,<2027.0)",
    "httpx[http2] (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "pyjwt (>=2.14.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "typer (>=0.27.2,<0.28.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "ruff (>=0.16.7,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "hypothesis (>=6.168.0,<7.0.0)"
]

[tool.ruff.lint]
ignore = ["F841"]

[tool.mypy]
exclude = ["alembic/"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
markers = [
    "fast: marca tests que se ejecutan muy rápido",
    "slow: marca tests que tocan la BD o internet y tardan mucho"
]

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "sklearn.*",
    "joblib.*"
]
ignore_missing_imports = true