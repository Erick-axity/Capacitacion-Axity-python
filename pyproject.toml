[project]
name = "capacitacion-axity-python"
version = "0.1.0"
description = ""
authors = [
    {name = "Erick Sebastian Meneses Navarro",email = "erick.meneses@axity.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "tzdata (>=2026.4,<2027.0)",
    "httpx[http2] (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "ruff (>=0.16.7,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.ruff.lint]
ignore = ["F841"]
