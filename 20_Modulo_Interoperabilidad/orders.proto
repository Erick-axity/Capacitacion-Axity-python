syntax = "proto3";

package orders;

// 1. EL SERVICIO: Los "endpoints" disponibles
service OrderService {
  rpc CreateOrder (OrderRequest) returns (OrderReply) {}
}

// 2. EL REQUEST (Entrada)
message OrderRequest {
  string product_id = 1;
  int32 quantity = 2;
}

// 3. EL RESPONSE (Salida)
message OrderReply {
  string order_id = 1;
  string status = 2;
}