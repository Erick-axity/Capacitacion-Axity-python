[project]
name = "modulo-ci-cd-y-docker"
version = "0.1.0"
description = ""
authors = [
    {name = "Erick Sebastian Meneses Navarro",email = "erick.meneses@axity.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "pyjwt (>=2.15.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pydantic (>=2.13.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "ruff (>=0.16.8,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.ruff.lint]
ignore = ["F841"]

[tool.mypy]
exclude = ["alembic/"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
markers = [
    "fast: marca tests que se ejecutan muy rápido",
    "slow: marca tests que tocan la BD o internet y tardan mucho"
]